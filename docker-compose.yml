services:
  bag-backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file:
      - .env
    container_name: bag-backend
    restart: always
    expose:
      - "4001"
    environment:
      - MONGO_URI=${MONGO_URI}
      - PORT=4001
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4001/api/health"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - proxy-network
    # ---> ¡AQUÍ LO METES! <---
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  bag-frontend:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: bag-frontend
    restart: always
    expose:
      - "80"
    depends_on:
      bag-backend:
        condition: service_healthy
    networks:
      - proxy-network
    # ---> ¡AQUÍ TAMBIÉN! <---
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy-network:
    external: true
